# Blueprint do Render para o backend (api-gateway + microsserviços).
# O frontend (apps/web) NÃO entra aqui — continua na Vercel.
# Deploy via Docker (Dockerfile de cada serviço), não pelo runtime Node nativo
# do Render — mesma imagem que você builda e testa localmente com
# `docker compose up`.
#
# Como usar:
#   1. No Render, "New" → "Blueprint" → aponte pro repositório.
#   2. Render lê este arquivo e cria os 3 serviços abaixo automaticamente.
#   3. Preencha manualmente (Render vai pedir, por causa de "sync: false"):
#        - api-gateway: ADMIN_USER, ADMIN_PASS_HASH
#          (cole o hash bcrypt cru, sem escapar "$" — isso só é necessário
#          no .env.docker do docker-compose local, não no dashboard do Render)
#        - info-service: DATABASE_URL (connection string do Neon)
#        - blog-service: DATABASE_URL (mesma do info-service, ou outra
#          database do mesmo projeto Neon — os dois usam tabelas próprias)
#      JWT_SECRET e INTERNAL_SECRET são gerados automaticamente pelo Render
#      (generateValue/fromService) — não precisa mexer. Depois do primeiro
#      deploy, vale conferir nas env vars dos 3 serviços se o INTERNAL_SECRET
#      ficou realmente idêntico nos três — se o Render não linkar sozinho,
#      copie o valor gerado em nerivan-info-service pros outros dois na mão.
#   4. Aponte o DNS de api.nerivan.site pro serviço nerivan-api-gateway
#      (Render → nerivan-api-gateway → Settings → Custom Domain).
#
# info-service e blog-service são "web" (o plano free do Render não permite
# Private Service nem a rede interna privada — os dois são recurso de plano
# pago). Isso significa que o gateway fala com eles pela URL pública normal
# (https://nerivan-info-service-xxxx.onrender.com), não por um endereço
# interno. Continuam protegidos pelo INTERNAL_SECRET — qualquer request sem
# o header certo toma 403, de dentro ou de fora do Render — só que agora sem
# isolamento de rede como camada extra. Se algum dia migrar pra um plano
# pago, dá pra trocar "type: web" por "type: pserv" nesses dois, tirar o
# healthCheckPath (pserv não aceita) e trocar "property: host" por
# "property: hostport" no INFO_SERVICE_URL/BLOG_SERVICE_URL do gateway.

services:
  # ─── API Gateway — roteia tudo, único ponto de entrada pro frontend ───────
  - type: web
    name: nerivan-api-gateway
    runtime: docker
    dockerfilePath: ./apps/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nerivan-info-service
          envVarKey: INTERNAL_SECRET
      - key: INFO_SERVICE_URL
        fromService:
          type: web
          name: nerivan-info-service
          property: host
      - key: BLOG_SERVICE_URL
        fromService:
          type: web
          name: nerivan-blog-service
          property: host
      - key: ALLOWED_ORIGINS
        value: https://nerivan.site,https://www.nerivan.site
      - key: COOKIE_DOMAIN
        value: .nerivan.site

  # ─── Info Service — protegido pelo INTERNAL_SECRET, não pra ser usado direto ──
  - type: web
    name: nerivan-info-service
    runtime: docker
    dockerfilePath: ./apps/info-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4001"
      - key: INTERNAL_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  # ─── Blog Service — protegido pelo INTERNAL_SECRET, não pra ser usado direto ──
  - type: web
    name: nerivan-blog-service
    runtime: docker
    dockerfilePath: ./apps/blog-service/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4002"
      - key: INTERNAL_SECRET
        fromService:
          type: web
          name: nerivan-info-service
          envVarKey: INTERNAL_SECRET
      - key: DATABASE_URL
        sync: false
