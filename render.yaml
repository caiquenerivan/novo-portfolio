# Blueprint do Render para o backend (api-gateway + microsserviços).
# O frontend (apps/web) NÃO entra aqui — continua na Vercel.
#
# Como usar:
#   1. No Render, "New" → "Blueprint" → aponte pro repositório.
#   2. Render lê este arquivo e cria os 3 serviços abaixo automaticamente.
#   3. Preencha manualmente (Render vai pedir, por causa de "sync: false"):
#        - api-gateway: ADMIN_USER, ADMIN_PASS_HASH
#      JWT_SECRET e INTERNAL_SECRET são gerados automaticamente pelo Render
#      (generateValue/fromService) — não precisa mexer. Depois do primeiro
#      deploy, vale conferir nas env vars dos 3 serviços se o INTERNAL_SECRET
#      ficou realmente idêntico nos três — se o Render não linkar sozinho,
#      copie o valor gerado em nerivan-info-service pros outros dois na mão.
#   4. Aponte o DNS de api.nerivan.site pro serviço nerivan-api-gateway
#      (Render → nerivan-api-gateway → Settings → Custom Domain).
#   5. Planos "free" podem não estar disponíveis pra Private Service (pserv)
#      na sua conta — se o Render reclamar, troque "plan: free" por
#      "plan: starter" nos dois pserv abaixo.
#
# info-service e blog-service são "pserv" (Private Service): não têm URL
# pública, só são alcançáveis pela rede interna do Render — ninguém de fora
# consegue bater neles diretamente, nem com o INTERNAL_SECRET. Só o gateway
# enxerga os dois, exatamente como em dev (onde o INTERNAL_SECRET já era a
# única barreira). Isso é uma camada a mais de isolamento de rede.

services:
  # ─── API Gateway — único serviço público ─────────────────────────────────
  - type: web
    name: nerivan-api-gateway
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=apps/api-gateway
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS_HASH
        sync: false
      - key: INTERNAL_SECRET
        fromService:
          type: pserv
          name: nerivan-info-service
          envVarKey: INTERNAL_SECRET
      - key: INFO_SERVICE_URL
        fromService:
          type: pserv
          name: nerivan-info-service
          property: hostport
      - key: BLOG_SERVICE_URL
        fromService:
          type: pserv
          name: nerivan-blog-service
          property: hostport
      - key: ALLOWED_ORIGINS
        value: https://nerivan.site,https://www.nerivan.site
      - key: COOKIE_DOMAIN
        value: .nerivan.site

  # ─── Info Service — privado, sem URL pública ─────────────────────────────
  - type: pserv
    name: nerivan-info-service
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=apps/info-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4001"
      - key: INTERNAL_SECRET
        generateValue: true

  # ─── Blog Service — privado, sem URL pública ─────────────────────────────
  - type: pserv
    name: nerivan-blog-service
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start --workspace=apps/blog-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4002"
      - key: INTERNAL_SECRET
        fromService:
          type: pserv
          name: nerivan-info-service
          envVarKey: INTERNAL_SECRET
